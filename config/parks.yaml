  - slug: truist_park
    match: {venue_name: "Truist Park"}
    altitude_ft: 1050
  - slug: wrigley_field
    match: {venue_name: "Wrigley Field"}
    altitude_ft: 600
    notes: The park where the wind component matters most. Orientation is a blocking gap here.
  - slug: yankee_stadium
    match: {venue_name: "Yankee Stadium"}
