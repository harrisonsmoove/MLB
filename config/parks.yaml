  # --- venues used only for part of the 2021-2025 window ---
  - slug: oakland_coliseum
    match: {venue_name: ["Oakland Coliseum", "RingCentral Coliseum", "Oakland-Alameda County Coliseum"]}
    altitude_ft: 10
    active_through: 2024
  - slug: sutter_health_park
    match: {venue_name: "Sutter Health Park"}
    altitude_ft: 25
    active_from: 2025
    notes: Athletics home park from 2025. Minor league park, different dimensions and a grass/turf change - park factors must be estimated from scratch, not inherited from Oakland.
  - slug: steinbrenner_field
    match: {venue_name: "George M. Steinbrenner Field"}
    altitude_ft: 25
    active_from: 2025
    notes: Rays home park for 2025. Spring training park, open air, Florida summer - a very different run environment from the Trop dome.
  - slug: sahlen_field
    match: {venue_name: "Sahlen Field"}
    altitude_ft: 600
