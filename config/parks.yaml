  - slug: loandepot_park
    match: {venue_name: "loanDepot park"}
    altitude_ft: 10
    roof: retractable
  - slug: american_family_field
    match: {venue_name: "American Family Field"}
    altitude_ft: 635
    roof: retractable
  - slug: nationals_park
    match: {venue_name: "Nationals Park"}
    altitude_ft: 25
  - slug: oracle_park
    match: {venue_name: "Oracle Park"}
    altitude_ft: 10
  - slug: camden_yards
