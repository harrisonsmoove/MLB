# Park metadata that the MLB Stats API does NOT provide.
#
# Deliberately minimal. Anything the API is authoritative for (venue_id, name,
# lat/lon, field dimensions) is pulled by `mlb-edge parks sync` and reconciled
# against this file, rather than transcribed here where it would silently rot.
#
# Parks are keyed by venue_id (filled in by `parks sync` via match.venue_name).
# NOTE: parks are keyed by VENUE, never by team. Teams move: the Blue Jays
# played 2021 home games in Dunedin and Buffalo, the Athletics moved to
# Sacramento in 2025, and the Rays played 2025 at Steinbrenner Field. Neutral
# site games (London, Mexico City, Field of Dreams, Rickwood) are real
# regular-season games with real park effects.
#
# FIELD STATUS
#   altitude_ft     - approximate (±25 ft except Coors/Mexico City which are
#                     the only two where the error would matter). Verify via
#                     `parks sync` against venue lat/lon + a DEM if precision
#                     is ever needed.
#   roof            - none | retractable | fixed. High confidence.
#   cf_bearing_deg  - compass bearing home plate -> centre field, degrees true.
#                     *** UNSET FOR EVERY PARK. *** This value is required to
#                     resolve a wind vector into an "out to centre / in from
#                     left" component. It is NOT guessed here: a wrong bearing
#                     produces a confidently wrong wind feature, which is worse
#                     than no wind feature. features/environment.py raises
#                     OrientationUnknown if it is null. Populate via
#                     `mlb-edge parks derive-orientation` (OSM stadium
#                     footprints) before enabling wind adjustments.

defaults:
  roof: none
  cf_bearing_deg: null
  orientation_source: unset

parks:
  - slug: angel_stadium
    match: {venue_name: "Angel Stadium"}
    altitude_ft: 160
  - slug: busch_stadium
    match: {venue_name: "Busch Stadium"}
    altitude_ft: 465
  - slug: chase_field
    match: {venue_name: "Chase Field"}
    altitude_ft: 1059
    roof: retractable
  - slug: citi_field
    match: {venue_name: "Citi Field"}
    altitude_ft: 20
  - slug: citizens_bank_park
    match: {venue_name: "Citizens Bank Park"}
    altitude_ft: 20
  - slug: comerica_park
    match: {venue_name: "Comerica Park"}
    altitude_ft: 600
  - slug: coors_field
    match: {venue_name: "Coors Field"}
    altitude_ft: 5200
    notes: >
      The one park where altitude dominates. Needs its own handling for both
      carry (offense up) and breaking-ball movement (pitcher stuff down), plus
      the humidor. Do not model as a scalar multiplier.
  - slug: daikin_park
    match: {venue_name: ["Daikin Park", "Minute Maid Park"]}
    altitude_ft: 45
    roof: retractable
    notes: Renamed from Minute Maid Park ahead of the 2025 season.
  - slug: dodger_stadium
    match: {venue_name: "Dodger Stadium"}
    altitude_ft: 500
  - slug: fenway_park
    match: {venue_name: "Fenway Park"}
    altitude_ft: 20
  - slug: globe_life_field
    match: {venue_name: "Globe Life Field"}
