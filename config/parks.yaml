    notes: Blue Jays home games, 2021.
  - slug: td_ballpark
    match: {venue_name: "TD Ballpark"}
    altitude_ft: 10
    active_from: 2021
    active_through: 2021
    notes: Blue Jays home games, early 2021.

  # --- neutral sites: low volume, high leverage if mis-keyed ---
  - slug: estadio_alfredo_harp_helu
    match: {venue_name: "Estadio Alfredo Harp Helu"}
    altitude_ft: 7350
    notes: Mexico City. Higher than Coors. A handful of games with an extreme run environment - exclude from park factor pooling, do not let them contaminate a team's home factor.
  - slug: london_stadium
