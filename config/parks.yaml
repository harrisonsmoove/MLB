    altitude_ft: 20
    notes: Left field wall moved back before 2022 and partially back in 2025 - park factors are NOT stable across the backfill window.
  - slug: petco_park
    match: {venue_name: "Petco Park"}
    altitude_ft: 20
  - slug: pnc_park
    match: {venue_name: "PNC Park"}
    altitude_ft: 730
  - slug: progressive_field
    match: {venue_name: "Progressive Field"}
    altitude_ft: 660
  - slug: rogers_centre
    match: {venue_name: "Rogers Centre"}
    altitude_ft: 250
    roof: retractable
    notes: Outfield fully reconfigured for 2023 and again for 2024 - treat pre/post separately.
  - slug: t_mobile_park
    match: {venue_name: "T-Mobile Park"}
