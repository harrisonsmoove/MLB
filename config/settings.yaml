# mlb-edge settings.
# Secrets are NEVER stored here. Any value of the form ${ENV_VAR} is resolved
# from the process environment at load time and is required to be present only
# if the owning source is enabled.

project:
  timezone: America/New_York        # scheduling / "game date" boundary

  # Data coverage. Statcast reaches back to 2015 and the projector needs those
  # earlier seasons so that an expanding window has real depth by the time the
  # evaluation period starts -- an April 2021 projection built on nothing is
  # noise contaminating the earliest and most valuable walk-forward folds.
  seasons: [2015, 2016, 2017, 2018, 2019, 2021, 2022, 2023, 2024, 2025, 2026]

  # Walk-forward evaluation window. Deliberately narrower than the data: the
  # earlier seasons exist to populate priors, not to be scored on.
  eval_seasons: [2021, 2022, 2023, 2024, 2025, 2026]

  # 2020 is excluded from both: 60-game season, no fans, seven-inning
  # doubleheaders and a runner-on-2nd rule that differs from later years.
  #
  # Known regime break: pitch tracking moved from Trackman to Hawk-Eye for
  # 2020. Pre-2020 measurements are not perfectly comparable to later ones,
  # which matters most for release-point and spin features. Batted-ball
  # exit velocity and launch angle are the most stable across the change,
  # which is part of why the projector leans on them.

paths:
  raw: data/raw
  warehouse: data/warehouse/mlb_edge.duckdb
  reports: reports

# ---------------------------------------------------------------------------
# The poller. A separate, deliberately dumb process: bytes to parquet on a
# schedule, no parsing, no warehouse. The CLV dataset only accumulates in
# wall-clock time, so this is the one component whose uptime cannot be made up
# for later.
# ---------------------------------------------------------------------------
poller:
  archive_dir: data/poll

  # The budget horizon. The odds poller spreads its remaining credits evenly
  # over the days to this date, so a free-tier key throttles itself to survive
  # the season instead of burning out in 2.6 days. Update it each year.
  # Through the POSTSEASON, not the regular season. This read 2026-09-28 for
  # three weeks, which is a budget-pacing bug wearing a date's clothes: as the
  # horizon closes the pacing term collapses below the configured interval, the
  # poller reverts to a flat 15 minutes, and 500 credits/month is gone in 2.6
  # days -- arriving exactly as October, the only live-fire window left, began.
  season_end_date: "2026-11-08"
  odds_interval_seconds: 900        # 15 min -- the FLOOR, not the guarantee
  kalshi_interval_seconds: 900      # Kalshi is not credit-metered
  # Sized for a full slate, not a guess: ~15 games x winner/total/game markets
  # runs well past 120. At kalshi rate_limit_per_minute=60 this is ~8 minutes of
  # a 15-minute cycle, and saturating it is a WARN plus an archived failure row.
  kalshi_max_orderbooks_per_tick: 500
  kalshi_markets_page_size: 200
  # Bounds the cursor loop. A capped single request silently drops everything
  # past the first page; an unbounded loop on a cursor that never clears spins
  # forever. Hitting this limit is archived as a failure row, not ignored.
  kalshi_max_pages: 25

  # --- health and completeness -------------------------------------------
  # State files live beside the archive so a restart -- expected, since the
  # unit restarts forever -- does not reset the clock and hide a running outage.
  health_state_file: poll_health.json
  alert_throttle_file: poll_alert_throttle.json

  # A venue silent this long WHILE GAMES ARE ON gets an alert. Off-slate silence
  # is correct behaviour; alerting on it would train you to ignore the alert
  # that matters.
  staleness_alert_minutes: 30
  alert_repeat_hours: 1

  # Compare each cycle's payloads against the MLB schedule and report
  # "captured X/Y games" per venue. This is the check that catches a silently
  # truncated board -- the failure that returns 200 on every request.
  completeness_enabled: true
  completeness_slate_lead_hours: 12
  completeness_slate_trail_hours: 5
  # A game this far out is reported as "not yet expected" rather than MISSING.
  # Books post a late game's market closer to first pitch, so the old single
  # 12-hour cliff demanded quotes that did not exist yet and reported their
  # absence as a shortfall -- which is how a check earns its way into the
  # ignored pile. Games between this and completeness_slate_lead_hours are
  # shown but not counted against any venue.
  completeness_quote_horizon_hours: 6
  # And the other end. A finished game's markets settle and leave the board --
  # Kalshi is polled with status=open, so its tickers simply stop appearing.
  # Observed live: a date's ticker count went 7 to 0 between two ticks three
  # minutes apart while the check still demanded that game. With a five-hour
  # trail and a three-hour game that left ~2h in which a complete, correctly
  # archived board was reported as a shortfall.
  completeness_quote_close_hours: 4
  schedule_cache_seconds: 1800
  # The schedule only feeds the completeness check, so it fails fast rather
  # than delaying the archive write behind a retry ladder.
  schedule_timeout_seconds: 10
  schedule_max_attempts: 2

# ---------------------------------------------------------------------------
# Off-box backup.
#
# The poll archive cannot be rebuilt from anything -- Tier 0 has no historical
# endpoint -- so if the droplet dies, whatever is not off-box is gone. The
# warehouse is derived and merely expensive to lose.
# ---------------------------------------------------------------------------
backup:
  directory: data/backups
  include: [data/poll, data/raw]
  keep_local: 3
  # Upload command; {src} is the backup directory. Shelling out to whatever
  # already works on the box keeps credentials in that tool's own config
  # rather than in this process. Leave empty to snapshot locally only.
  # Examples:
  #   aws s3 sync {src} s3://your-bucket/mlb-edge/$(basename {src}) --delete
  #   rclone copy {src} spaces:your-bucket/mlb-edge/
  push_command: ""
  # State beside the archive: when a backup last ran, and when a copy last
  # actually LEFT this box. Two facts, and only the second one survives the
  # droplet. The poller re-reads this every cycle and alerts when it lapses --
  # `push_command: ""` was a yellow line at deploy time for 23 days while the
  # one irreplaceable asset in the project sat in a single location.
  state_file: backup_state.json
  max_age_hours: 48

http:
  timeout_seconds: 30
  max_attempts: 5
  backoff_initial_seconds: 2
  backoff_max_seconds: 60
  user_agent: "mlb-edge/0.1 (research; contact via repo owner)"
  # The CA bundle is picked up from SSL_CERT_FILE / REQUESTS_CA_BUNDLE when set.

# ---------------------------------------------------------------------------
# Sources. `enabled: false` sources are skipped by the backfill orchestrator
# rather than failing it.
# ---------------------------------------------------------------------------
sources:

  mlb_statsapi:
    enabled: true
    base_url: https://statsapi.mlb.com/api/v1
    rate_limit_per_minute: 120
    # Endpoint templates. Kept in config so a shape/route change is a config
    # edit, not a code edit.
    endpoints:
      # Hydrated, for the ingester. StatsAPI rejects the WHOLE request with 406
      # when it does not recognise one hydrate term -- it does not ignore the
      # term -- so this string is a single point of failure for anything that
      # sends it. Bisect it with `mlb-edge probe-hydrate` after any 406; the
      # ingester also degrades to the bare call rather than returning nothing.
      schedule: "/schedule?sportId=1&startDate={start}&endDate={end}&hydrate={hydrate}"
      # Deliberately unhydrated, for the completeness check. The thing that
      # watches for silent breakage must have fewer dependencies than what it
      # watches, or it goes down with it: a hydrate term StatsAPI stopped
      # accepting took the check offline for weeks while the poller kept
      # writing, which is precisely the state the check exists to detect.
      schedule_minimal: "/schedule?sportId=1&startDate={start}&endDate={end}"
      game_feed: "/game/{game_pk}/feed/live"
      boxscore: "/game/{game_pk}/boxscore"
      venues: "/venues?hydrate=location,fieldInfo"
      teams: "/teams?sportId=1&season={season}"
      people: "/people?personIds={person_ids}&hydrate=stats(group=[hitting,pitching],type=[season])"
      transactions: "/transactions?startDate={start}&endDate={end}"
    # Hydrate terms as a LIST, not a baked string, so a rejected term can be
    # dropped individually instead of the request being abandoned. Order is
    # preserved. `mlb-edge probe-hydrate` tests each one against the live API
    # and prints the terms this list should contain.
    # Measured against the live API on 2026-08-30 with `mlb-edge probe-hydrate`,
    # not assumed. StatsAPI 406s the whole request on any term it does not
    # accept, so this list is only what actually returned 200:
    #
    #   probablePitcher          200   <- bare works
    #   probablePitcher(note)    406   <- the SUB-HYDRATION is what fails
    #   linescore                200
    #   venue                    406   (redundant anyway: the venues endpoint)
    #   weather                  406   <- see note below
    #   seriesStatus             406
    #   game(content(summary))   406
    #
    # The first two lines are the reason probe-hydrate probes base terms
    # separately. "probablePitcher(note) rejected" is not "probablePitcher
    # rejected", and dropping the term over its sub-field would have cost the
    # probable starters -- which the simulator keys on, and whose absence reads
    # as "no starter announced" rather than as a bug.
    #
    # Losing `weather` here costs nothing: the weather source is a separate
    # ingester writing weather_hourly, with its own forecast-vs-observation PIT
    # rule. Losing `venue` costs nothing either -- the venues endpoint is the
    # real source. Do not reintroduce either without re-probing.
    schedule_hydrate:
      - probablePitcher
      - linescore
    # Lineups are only trustworthy once the API marks them official.
    lineup_confirmed_status_codes: ["P", "PW", "S", "I", "IR", "IH", "MC", "MA", "MB", "MF", "MO", "MR", "MW"]

  statcast:
    enabled: true
    # Baseball Savant CSV export. This is the same endpoint pybaseball drives;
    # we call it directly so that the raw payload is cached verbatim and
    # version-stamped before parsing (Savant silently revises history).
    base_url: https://baseballsavant.mlb.com
    endpoints:
      search_csv: "/statcast_search/csv"
    # UNVERIFIED -- stated from memory, never probed, and it fails SILENTLY:
    # a chunk over the real cap comes back short with no error. chunk_days
    # below is derived from this number and inherits any error in it.
    row_cap: 30000          # believed: Savant truncates silently above this
    chunk_days: 3           # conservative; a busy day is ~4.5k pitches
    # UNVERIFIED -- Savant publishes no limit; 20 is this repo's guess. It is
    # also the number the "eight-hour backfill" estimate rests on, which is
    # what justified moving the k gate ahead of the backfill.
    rate_limit_per_minute: 20
    # Base query for the CSV export. Kept in config so a parameter rename
    # upstream is a config edit rather than a code change.
    query_params:
      all: "true"
      type: details
      player_type: pitcher
      min_pitches: "0"
      min_results: "0"
      group_by: name
      sort_col: pitches
      player_event_sort: api_p_release_speed
      sort_order: desc
      hfGT: "R|"
    # Statcast is retroactively revised. A cached chunk is re-pulled if older
    # than this, and any change lands as a new version rather than an overwrite.
    revision_recheck_days: 30
    recent_window_days: 21   # inside this window, re-pull daily

  fangraphs:
    enabled: true
    base_url: https://www.fangraphs.com
    endpoints:
      projections: "/api/projections"
    # Depth Charts is a 50/50 Steamer/ZiPS blend prorated to RosterResource
    # playing time. THE BAT X is hitters only.
    systems:
      batting: [steamer, zips, thebatx, atc, fangraphsdc]
      pitching: [steamer, zips, thebat, atc, fangraphsdc]
    rate_limit_per_minute: 10
    request:
      # UNVERIFIED against live: this session had no egress to fangraphs.com.
      # Run `mlb-edge probe fangraphs` after the first live fetch to dump the
      # observed keys, then correct `field_map` below. The parser tolerates a
      # wrong map by leaving columns null rather than crashing, and
      # `mlb-edge verify` reports the null rate so a bad map is visible.
      pos: all
      team: "0"
      players: "0"
      lg: all
    # Candidate source keys per warehouse column, tried in order. FanGraphs has
    # changed capitalisation and naming across API versions; listing aliases is
    # cheaper than pinning one and being wrong.
    field_map:
      player_id_mlbam: [xMLBAMID, mlbamid, MLBAMID, mlbam_id]
      player_id_fangraphs: [playerid, PlayerId, playerids, PlayerID]
      player_name: [PlayerName, Name, playerName]
      team: [Team, team, ShortName]
      pa: [PA]
      ab: [AB]
      ip: [IP]
      tbf: [TBF]
      k: [SO, K]
      bb: [BB]
      hbp: [HBP]
      doubles: ["2B"]
      triples: ["3B"]
      hr: [HR]
      hits: [H]
      woba: [wOBA]
      wrc_plus: [wRCplus, "wRC+", wRC_plus]
      era: [ERA]
      fip: [FIP]
      k_pct: [Kpct, "K%", K_pct]
      bb_pct: [BBpct, "BB%", BB_pct]
      gb_pct: [GBpct, "GB%", GB_pct]
      fb_pct: [FBpct, "FB%", FB_pct]

  retrosheet:
    enabled: true
    base_url: https://www.retrosheet.org
    endpoints:
      event_zip: "/events/{season}eve.zip"
    # Retrosheet publishes a season's event files the following spring. Stamping
    # as_of at retrieval time would claim we knew 2024's events during 2024;
    # this is the honest availability date and it keeps transition matrices for
    # season N fit on seasons < N.
    publication_mmdd: "04-01"
    publication_year_offset: 1
    # Retrosheet publishes a season's events the following spring.
    seasons: [2015, 2016, 2017, 2018, 2019, 2021, 2022, 2023, 2024]

  weather:
    enabled: true
    # Open-Meteo: free, no key. Forecast endpoint for live use, archive
    # endpoint for backfill (ERA5 reanalysis, ~5 day lag).
    base_url: https://api.open-meteo.com/v1
    archive_url: https://archive-api.open-meteo.com/v1
    endpoints:
      forecast: "/forecast"
      archive: "/archive"
    hourly_variables:
      - temperature_2m
      - relative_humidity_2m
      - surface_pressure
      - wind_speed_10m
      - wind_direction_10m
      - precipitation_probability
      - cloud_cover
    rate_limit_per_minute: 60

  umpires:
    enabled: true
    # Home-plate umpire assignment comes from the StatsAPI game feed
    # (officials block). Umpire *ratings* are derived in-house from Statcast
    # called-strike data rather than scraped, so there is no third-party
    # endpoint here.
    derive_from: statcast
    min_called_pitches_for_rating: 1500
    shrinkage_prior_pitches: 3000

  odds:
    enabled: false            # requires ODDS_API_KEY
    provider: the_odds_api
    base_url: https://api.the-odds-api.com/v4
    api_key: ${ODDS_API_KEY}
    endpoints:
      sports: "/sports"
      odds: "/sports/{sport}/odds"
      event_odds: "/sports/{sport}/events/{event_id}/odds"
      historical_odds: "/historical/sports/{sport}/odds"
    sport_key: baseball_mlb
    # Tier 0 (free) = moneyline only, forward archive, no historical backfill.
    tier: 0
    regions_by_tier:
      0: [us, eu]
      1: [us, us2, eu, uk]
    markets_by_tier:
      0: [h2h]
      1: [h2h, spreads, totals, team_totals]
    rate_limit_per_minute: 10
    monthly_request_budget: 500     # free tier; the poller refuses to exceed it

  kalshi:
    enabled: false            # requires KALSHI_API_KEY_ID + KALSHI_PRIVATE_KEY_PATH
    base_url: https://api.elections.kalshi.com/trade-api/v2
    api_key_id: ${KALSHI_API_KEY_ID}
    private_key_path: ${KALSHI_PRIVATE_KEY_PATH}
    endpoints:
      exchange_status: "/exchange/status"
      series: "/series"
      markets: "/markets"
      market: "/markets/{ticker}"
      orderbook: "/markets/{ticker}/orderbook"
      fee_schedule: "/exchange/schedule"
    series_tickers: [KXMLBGAME, KXMLBWINNER, KXMLBTOTAL]
    # UNVERIFIED against what Kalshi will SERVE -- probe with
    # `mlb-edge probe-depth --live`. What is measured (2026-09-24, 464,917
    # archived snapshots): the payload shape is
    #   {"orderbook_fp": {"yes_dollars": [["0.5400","3012.00"], ...],
    #                     "no_dollars":  [["0.0200","7002.00"], ...]}}
    # price/size pairs as decimal strings, and the size column is real,
    # substantial and has been collecting correctly the whole time.
    # MEASURED 2026-09-24 with `mlb-edge probe-depth --live`: real books run
    # 22-30 levels. At 10 we recorded roughly a third of every book for 25
    # days, and that loss is permanent -- there is no historical orderbook
    # endpoint. 100 is comfortably above the observed maximum; Kalshi returns
    # what exists rather than padding, so asking for more than a book holds
    # costs nothing.
    #
    # Cost of the change: request COUNT is unchanged, so the rate-limit and
    # sweep-duration arithmetic is untouched. Payloads grow with levels --
    # roughly 60 MB/month to 170 MB/month compressed -- which lands on backup
    # transfer and object storage, not on the poll cycle.
    orderbook_depth: 100
    markets_page_size: 200
    max_pages: 25
    # VERIFIED against live payloads on 2026-08-30. These patterns read TITLES,
    # which is fine for classifying a market's type but is NOT how a market is
    # joined to a game: Kalshi titles name teams by city only ("Seattle",
    # "A's"), so substring matching counted 1 of 14 games while the archive held
    # 13. Games are joined on the TICKER instead -- see
    # src/mlb_edge/kalshi_tickers.py. A market matching none of these patterns
    # is counted as unmapped and skipped, never guessed into a game.
    market_parsers:
      - market_type: h2h
        title_pattern: "(?i)will the (?P<team>.+?) (?:win|beat)"
        side: team
      - market_type: totals
        title_pattern: "(?i)(?:total runs|combined runs).*?(?P<line>\\d+(?:\\.\\d+)?)"
        side: over
      - market_type: spreads
        title_pattern: "(?i)(?P<team>.+?) (?:by|cover).*?(?P<line>[-+]?\\d+(?:\\.\\d+)?)"
        side: team
    # Fees are FETCHED, never hardcoded. If the fetch fails the trading path
    # halts rather than assuming a formula.
    fees:
      source: fetch
      cache_ttl_hours: 24
      allow_hardcoded_fallback: false
    # UNVERIFIED -- probe with `mlb-edge probe-ratelimit --venue kalshi`.
    # This bounds the SLOWER leg of the whole gap measurement: at ~200 tickers
    # a full sweep takes 200s here, so even the configured rate leaves the
    # 15-minute cadence a factor of four unused.
    rate_limit_per_minute: 60

  polymarket:
    enabled: false            # requires POLYMARKET_* credentials for trading
    base_url: https://clob.polymarket.com
    gamma_url: https://gamma-api.polymarket.com
    endpoints:
      markets: "/markets"
      book: "/book"
      books: "/books"
      gamma_events: "/events"
    rate_limit_per_minute: 60
    events_page_size: 200
    max_pages: 10
    fees:
      source: fetch
      cache_ttl_hours: 24
      allow_hardcoded_fallback: false

# ---------------------------------------------------------------------------
# Plate-appearance taxonomy.
#
# Statcast's `events` vocabulary maps onto the eight outcome buckets the
# simulator draws from. Kept in config because the vocabulary grows: an event
# that matches nothing here is COUNTED AND REPORTED, never quietly bucketed as
# an out. A taxonomy that silently absorbs the unknown looks complete and is
# not, and the error would land entirely in one bucket.
# ---------------------------------------------------------------------------
pa_outcomes:
  buckets: [K, BB, HBP, 1B, 2B, 3B, HR, OUT]

  events:
    K: [strikeout, strikeout_double_play, strikeout_triple_play]
    BB: [walk]
    HBP: [hit_by_pitch]
    1B: [single]
    2B: [double]
    3B: [triple]
    HR: [home_run]
    OUT:
      - field_out
      - force_out
      - grounded_into_double_play
      - double_play
      - triple_play
      - fielders_choice
      - fielders_choice_out
      - sac_fly
      - sac_fly_double_play
      - sac_bunt
      - sac_bunt_double_play
      - field_error
      - other_out
      - batter_out

  # Ends a plate appearance but is not a batter outcome we model. Excluded from
  # the denominator rather than dropped silently.
  excluded_events: [catcher_interf, batter_interference]

  # Appears in `events` on a pitch that does NOT end the plate appearance.
  # Filtered out before PAs are counted; a runner's stolen base is not a PA.
  non_pa_events:
    - caught_stealing_2b
    - caught_stealing_3b
    - caught_stealing_home
    - stolen_base_2b
    - stolen_base_3b
    - stolen_base_home
    - pickoff_1b
    - pickoff_2b
    - pickoff_3b
    - pickoff_caught_stealing_2b
    - pickoff_caught_stealing_3b
    - pickoff_caught_stealing_home
    - pickoff_error_1b
    - pickoff_error_2b
    - pickoff_error_3b
    - wild_pitch
    - passed_ball
    - balk
    - runner_double_play
    - other_advance
    - defensive_indiff
    - error
    - cs_double_play
    - stolen_base

  # Intentional walks are a manager's decision about the situation, not a
  # hitter's plate discipline. Flagged so the rate estimator can exclude them
  # and leave the simulator to reintroduce them from base-out state.
  intentional_walk_events: [intent_walk]
  intentional_walk_descriptions: [intent_ball]

  # Pitch-level `description` values, for the pitcher proxies. Whiff rate and
  # called-strike rate stabilise much faster than strikeout rate, which is why
  # they earn their own columns.
  descriptions:
    swing:
      - swinging_strike
      - swinging_strike_blocked
      - foul
      - foul_tip
      - foul_bunt
      - missed_bunt
      - hit_into_play
      - hit_into_play_score
      - hit_into_play_no_out
    whiff: [swinging_strike, swinging_strike_blocked, missed_bunt]
    called_strike: [called_strike]

# ---------------------------------------------------------------------------
# The in-house projector.
#
# Statcast-based rather than Marcel: built on contact quality and plate
# discipline, which stabilise far faster than the outcomes they produce, and
# which are point-in-time computable back to 2015. Closer in spirit to THE BAT X
# than to a three-year weighted average of results.
#
# Every regression constant below that could have been a hardcoded
# "stabilisation point" is instead FIT from data by empirical Bayes. The
# constants here are pooling strengths and window shapes -- structural choices,
# not borrowed numbers.
# ---------------------------------------------------------------------------
projector:
  system_name: inhouse_statcast

  # Talent moves. Exponential rather than the usual fixed 5/4/3 season weights
  # because there is nothing physically special about a January boundary, and a
  # step function makes every projection jump on New Year's Day.
  recency_halflife_days: 730

  # Players below this weighted PA count do not inform the beta-binomial
  # variance estimate. Selecting on playing time biases k upward (toward
  # over-regression); letting 5-PA call-ups set the variance is worse.
  # This is the fit actually used for shrinkage.
  min_trials_for_constant_fit: 200

  # Extra fits, computed and reported but never used to shrink anything.
  # The point is diagnosis: published true-talent spreads are measured on
  # qualified hitters, so fitting across everyone including call-ups widens the
  # observed spread, raises sigma^2, and pulls k DOWN. A ratio that misses on
  # the low side could therefore be sample composition rather than a
  # mis-specified estimator -- and the only way to tell is to see whether the
  # ratio moves with the population.
  diagnostic_fit_thresholds: [0, 300]

  # Which fit the pre-registered gate compares. 300 PA rather than the
  # shrinkage fit's 200, because the target was derived from qualified-hitter
  # spread and the comparison has to use a comparable population. Comparing an
  # all-hitters fit against a qualified-hitter target is not apples to apples.
  gate_min_trials: 300

  # Pooling strength for league -> handedness -> experience cells.
  hierarchy_pooling_k: 400

  # Individual platoon splits need heavy shrinkage: most hitters have no stable
  # personal platoon skill at the sample sizes available, so the prior is the
  # player's own overall rate plus the league platoon delta for his handedness.
  platoon_prior_k: 2000

  rookie_pa_threshold: 500
  # Pooling strength for contact-table cells toward their launch-angle band.
  # Read as "observations at which a cell's own rate is worth as much as its
  # band's". A few dozen batted balls already pin a five-way outcome split
  # reasonably well, and 200 was strong enough to smooth a barrelled cell --
  # which really is nearly all home runs -- back toward the band average.
  # Should be tuned out-of-sample once real data exists.
  battedball_pooling_k: 40

  # How often to snapshot projections during a season. Weekly is finer than
  # talent actually moves and keeps the table small enough to scan.
  snapshot_cadence_days: 7

  # Minimum weighted PAs before a player gets his own row rather than being
  # served the prior cell directly.
  min_pa_for_own_row: 1.0

# ---------------------------------------------------------------------------
# Downstream parameters. Not used by Milestone 1 ingestion, defined here so the
# model/strategy layers never invent a constant inline.
# ---------------------------------------------------------------------------
simulation:
  n_sims: 25000
  random_seed: 20260101
  # The automatic runner on second is SEASON-CONDITIONAL: regular season from
  # 2020, never in the postseason. An unconditional flag silently applied it to
  # 2018-2019, which compresses the extra-innings tail -- and the tail is
  # precisely what the run-distribution validation checks. The rule itself lives
  # in src/mlb_edge/rules.py so it cannot be flipped on by a single boolean.
  #
  # Same for the designated hitter, which moves league run scoring by roughly
  # 0.2-0.3 R/G and would otherwise be attributed to the state machine.
  season_rules_module: mlb_edge.rules

market:
  # Book-name to MLB-name aliases, applied after normalisation. Only entries
  # that a name-based match genuinely cannot resolve belong here; the matcher
  # builds the rest from the teams table so franchise renames resolve for the
  # seasons in which each name was current.
  team_aliases:
    oaklandathletics: athletics
    lasvegasathletics: athletics
    sacramentoathletics: athletics
    clevelandindians: cleveland guardians
    laangels: los angeles angels
    losangelesangelsofanaheim: los angeles angels

  devig_method: power              # multiplicative | additive | power | shin
  devig_method_by_market:
    h2h: power
    totals: multiplicative
    spreads: multiplicative

blend:
  # logit(p_final) = w*logit(p_model) + (1-w)*logit(p_market) + beta
  # w is FIT out of sample. These are inert placeholders; a fitted value near
  # 1.0 should be treated as a bug, not a triumph.
  weight: null
  intercept: null
  refit_frequency_days: 30

strategy:
  edge_shrinkage: 0.5
  kelly_fraction: 0.25
  min_edge_after_shrinkage: 0.015
  max_stake_fraction_of_bankroll: 0.02
  max_exposure_per_game_fraction: 0.04
  max_daily_exposure_fraction: 0.10
  drawdown_halt_fraction: 0.20     # halts and requires manual re-enable
  paper_mode: true
  min_paper_bets_before_live: 400

eval:
  min_bets_for_roi_claim: 500
  bootstrap_iterations: 10000
