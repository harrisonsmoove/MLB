[project]
name = "mlb-edge"
version = "0.1.0"
description = "MLB game simulation and betting system optimised for closing line value"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.9.0",
    "pyarrow>=17.0.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "python-dateutil>=2.9.0",
    "cryptography>=50.0.1",
    "pytz>=2026.3.post1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
mlb-edge = "mlb_edge.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits real external APIs; skipped unless MLB_EDGE_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
